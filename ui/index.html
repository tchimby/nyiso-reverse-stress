<style>
:root{--bg:#f7f7f5;--fg:#1c1c1a;--mut:#6b6b66;--card:#fff;--line:#e2e2dc;--acc:#2f5fd0;--llm:#b4531f;--bad:#c0392b;--good:#2e8b57}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,Segoe UI,sans-serif}
header{padding:20px 16px 4px;max-width:1100px;margin:auto}h1{margin:0;font-size:23px}p.sub{margin:4px 0 0;color:var(--mut)}

table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:600}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}

.hint{color:var(--mut);font-size:12.5px;margin:0 0 8px}details .hint p{margin:6px 0}#sbexpl{white-space:pre-wrap;margin-top:8px}input[type=range]{width:100%}.ctl{display:grid;grid-template-columns:170px 1fr 70px;gap:8px;align-items:center;margin:4px 0;font-size:13px}.ctl output{text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:28px;font-weight:650;font-variant-numeric:tabular-nums}.ok{color:var(--good)}.no{color:var(--bad)}svg text{fill:var(--mut);font:11px system-ui}svg .ax{stroke:var(--line)}svg .tg{stroke:var(--bad);stroke-dasharray:4 3}

<body>
<header><h1>Reverse stress testing a NYISO power book with an LLM agent</h1><p class="sub">An end-to-end, public-data prototype for buy-side risk management. Each tab is one part of the project.</p></header>
<nav id="nav"></nav>
<main id="main">Loading...</main>
<script src="engine.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s), fmtM=v=>v==null?'-':(v/1e6).toFixed(2)+'M', f2=v=>v==null?'-':(+v).toFixed(2);
const D={};const TABS=['Brief','Pipeline','Data','Engine','LLM agent','Try it','Results','Evaluation','Limits','Demo'];let tab='Brief',run='live_daily_sonnet',sidx=0;
async function load(){
 for(const n of ['meta','runs','scenarios','factors','ablations','engine']) D[n]=await (await fetch('data/'+n+'.json')).json();
 $('#nav').innerHTML=TABS.map(t=>'<button data-t="'+t+'">'+t+'</button>').join('');
 $('#nav').onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;draw()}};draw()}
function bars(obj,max,cls){const m=max||Math.max(...Object.values(obj).map(Math.abs),1);
 return Object.entries(obj).map(([k,v])=>'<div style="display:flex;align-items:center;gap:8px;margin:2px 0"><span style="width:96px;color:var(--mut);font-size:12px">'+k+'</span><div style="flex:1"><div class="bar '+(cls||(v<0?'neg':''))+'" style="width:'+Math.max(2,Math.abs(v)/m*100)+'%"></div></div><span style="width:62px;text-align:right;font-size:12px">'+(cls?(+v).toFixed(1):fmtM(v))+'</span></div>').join('')}
function sel(){return '<select id="run">'+Object.entries(D.runs).map(([k,v])=>'<option value="'+k+'"'+(k==run?' selected':'')+'>'+v.label+'</option>').join('')+'</select>'}
function node(t,llm){return '<span class="node'+(llm?' llm':'')+'">'+t+'</span>'}
const ar='<span class="arrow">&rarr;</span>';

const SB={season:'winter',shock:{duration_days:7,gas_hh_pct:0,ny_gas_basis_usd:0,load_peak_ratio:1,dc_load_shock_mw:0,wh_onpeak_pct:0,dom_minus_wh_usd:150,dart_pct:0}};
const SL=[['duration_days','Duration (days)',0,30,1],['gas_hh_pct','Henry Hub gas (%)',-60,300,5],['ny_gas_basis_usd','N.Y. gas basis ($/MMBtu)',0,20,0.5],['load_peak_ratio','Peak load ratio',0.8,1.3,0.01],['dc_load_shock_mw','Large-load shock (MW)',-2000,2000,50],['wh_onpeak_pct','WEST on-peak price (%)',-80,200,5],['dom_minus_wh_usd','N.Y.C. minus WEST ($/MWh)',-100,500,10],['dart_pct','Real-time vs day-ahead (%)',-90,300,5]];
const MAPK={large_load_shock_mw:'dc_load_shock_mw',ref_onpeak_pct:'wh_onpeak_pct',pocket_minus_ref_usd:'dom_minus_wh_usd'};
const HELP={
duration_days:'How many days the shock lasts, counted from the start of the 30-day base window. When it ends, the price and spread effects do not vanish: they keep about 55-60% of the previous day size each day (persistence). Longer shocks lose more because the retail obligation P5 pays out every day.',
gas_hh_pct:'Percent change of the Henry Hub gas price on shocked days (+100 = doubling). It lifts power prices through the fitted gas pass-through and the fuel side of the heat-rate call P4.',
ny_gas_basis_usd:'Extra cost of gas delivered to New York above Henry Hub, in $/MMBtu, added on shocked days. It only enters the heat-rate call P4 (higher fuel cost, so P4 pays less). It does not move power prices.',
load_peak_ratio:'Multiplier on the daily peak load (1.10 = 10% above the base day). More load raises WEST prices (the fit is convex) and raises the volume of the retail obligation P5 in proportion.',
dc_load_shock_mw:'MW added to the daily peak load on top of the ratio, for example a large new load arriving. Negative values remove load. It is not weather, so it does not change degree days.',
wh_onpeak_pct:'Extra percent move of the WEST on-peak price beyond what gas and load already imply (the residual factor s). Use it for supply events with no gas or load cause. Negative values hurt the long WEST swap P1 and the WEST hedge leg of P5.',
dom_minus_wh_usd:'Extra N.Y.C. minus WEST spread in $/MWh on shocked days: congestion into the city. It raises N.Y.C. prices without moving WEST. This is the main loss driver, because the retail obligation P5 is short N.Y.C. at a fixed price and the spread position P2 is only a small offset.',
dart_pct:'Real-time versus day-ahead price in percent (+60 = real-time 60% above day-ahead). Real-time prices settle the book: positive values help P1 and P4 but hurt the short DA-RT position P3.'};
const GUIDE='<details><summary>How to read these results</summary><div class="hint" style="font-size:13px">'+
'<p><b>Loss.</b> Sum over the 30-day window of the book P&amp;L with the shock, minus the same window with no shock. Positive means money lost. The target is $5M, 25% of the $20M allocated capital.</p>'+
'<p><b>Breach.</b> A scenario counts only if it loses at least $5M, is rare enough in history (q below 5%) and breaks no rule or limit. A loss without that is a bad world, not a plausible one.</p>'+
'<p><b>D&sup2;.</b> How strange the worst shocked day is compared with a typical day of the same season, measured on five factors at once (gas, load, WEST price residual, N.Y.C.-WEST spread, real-time vs day-ahead) and taking their correlations into account. Larger means stranger.</p>'+
'<p><b>Rank q.</b> The share of the 255 historical 10-day windows (2019-2025) whose worst day was at least as strange. q = 0.02 means 2% of past windows were as extreme. It is a rank within a short history, not a probability. Below 1% = severe, 1-5% = adverse, above 5% = ordinary.</p>'+
'<p><b>Implausible.</b> A factor goes beyond 1.25 times its historical range for that season, or a hard rule fails (price cap of $5,000/MWh, or extreme weather with falling load). Such a scenario is rejected even if it loses a lot.</p>'+
'<p><b>Positions.</b> P1 long WEST on-peak swap (system price). P2 long N.Y.C. spread (congestion). P3 short DA-RT spread (real-time risk). P4 heat-rate call (gas). P5 N.Y.C. retail load obligation (zone price and volume). P6 short tail call (spikes).</p></div></details>';
function fromAgent(sh){const o={};for(const[k,v]of Object.entries(sh)){const e=MAPK[k]||k;if(e in RevEngine.NEUTRAL)o[e]=v}return o}
function tick(v){return Math.abs(v)>=1e6?(v/1e6).toFixed(1)+'M':Math.abs(v)>=1000?(v/1000).toFixed(0)+'k':v.toFixed(0)}
function lineChart(title,unit,xs,series,opt){opt=opt||{};const W=520,H=210,L=44,R=10,T=22,B=26;
 const all=series.flatMap(s=>s.y).concat(opt.hline!=null?[opt.hline]:[]);let lo=Math.min(...all),hi=Math.max(...all);if(lo===hi){lo-=1;hi+=1}const pad=(hi-lo)*0.06;lo-=pad;hi+=pad;
 const X=i=>L+(W-L-R)*i/(xs.length-1),Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));let g='';
 for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4;g+='<line class="ax" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text x="'+(L-4)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+tick(v)+'</text>'}
 if(opt.shade>0)g+='<rect x="'+X(0)+'" y="'+T+'" width="'+(X(Math.min(opt.shade,xs.length)-1)-X(0))+'" height="'+(H-T-B)+'" fill="var(--acc)" opacity="0.08"/>';
 if(opt.hline!=null)g+='<line class="tg" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(opt.hline)+'" y2="'+Y(opt.hline)+'"/><text x="'+(W-R)+'" y="'+(Y(opt.hline)-4)+'" text-anchor="end" style="fill:var(--bad)">'+opt.hlabel+'</text>';
 series.forEach(s=>{g+='<polyline fill="none" stroke="'+s.color+'" stroke-width="'+(s.w||2)+'" '+(s.dash?'stroke-dasharray="5 4" ':'')+'points="'+s.y.map((v,i)=>X(i)+','+Y(v)).join(' ')+'"/>'});
 [0,Math.floor((xs.length-1)/2),xs.length-1].forEach(i=>{g+='<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle">'+xs[i].slice(5)+'</text>'});
 const lg=series.map(s=>'<span style="color:'+s.color+'">&#9632;</span> '+s.name).join(' &nbsp; ');
 return '<div style="min-width:0"><b>'+title+'</b> <span style="color:var(--mut)">'+unit+'</span><svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+title+'">'+g+'</svg><div style="font-size:12px;color:var(--mut)">'+lg+'</div>'+(opt.note?'<div class="hint">'+opt.note+'</div>':'')+'</div>'}
function cumsum(daily){let c=0;return daily.map(d=>{c+=Object.values(d).reduce((a,b)=>a+b,0);return c})}
function sbOut(){const E=D.engine;let r;try{r=RevEngine.run(E,SB.season,SB.shock)}catch(e){$('#sbout').innerHTML='<div class="card warn">'+e.message+'</div>';return}
 const sc=r.score,xs=r.path.map(x=>x.date),base=E.seasons[SB.season].rows,dur=Math.round(SB.shock.duration_days);
 const bpath=base.map(x=>Object.assign({},x,{capped:false}));const cb=cumsum(RevEngine.pnl(E,bpath)),cs=cumsum(r.daily),rel=cs.map((v,i)=>v-cb[i]);
 const win=[...E.q.window_d2].sort((a,b)=>b-a),line5=win[Math.ceil(0.05*win.length)-1];
 LAST={season:SB.season,shock:Object.assign({},SB.shock),loss:r.loss_usd,pos:r.pnl_by_position,ch:r.pnl_by_channel,d2:sc.d2,q:sc.q,sev:sc.severity,mex:sc.marginals_exceeded,fail:sc.hard_rule_failures,worst:sc.worst_day,breach:r.breach,days:dur,
  peakWest:Math.max(...r.path.map(x=>x.wh_on)),baseWest:Math.max(...base.map(x=>x.wh_on)),peakSpread:Math.max(...r.path.map(x=>x.dom_on-x.wh_on)),baseSpread:Math.max(...base.map(x=>x.dom_on-x.wh_on)),d2line:line5};
 {const wi=Math.max(0,r.path.findIndex(x=>x.date===sc.worst_day)),wf=sc.factors[wi],ss=E.seasons[wf.sn];LAST.fac=['g','l','s','c','d'].map((k,i)=>({k,v:wf[k],mu:ss.mu[i],lo:ss.limits[k][0],hi:ss.limits[k][1]}))}
 const exn=$('#sbexpnote');if(exn&&$('#sbexpl')&&$('#sbexpl').dataset.done)exn.textContent='The scenario changed since this explanation was written.';
 const verdict=r.breach?'<span class="ok">Breach: loss at least $5M, q below 5%, rules passed</span>':(r.loss_usd>=E.target_usd?'<span class="no">Loses $5M but is not a valid breach ('+(sc.severity==='implausible'?'implausible':'q = '+sc.q.toFixed(3)+', '+sc.severity)+')</span>':'<span style="color:var(--mut)">Below the $5M target</span>');
 $('#sbout').innerHTML='<div class="card"><div class="row"><div><div style="color:var(--mut)">Scenario loss (vs unshocked path)</div><div class="big">'+fmtM(r.loss_usd)+'</div><div>'+verdict+'</div></div><div><span class="pill">D&sup2; '+sc.d2.toFixed(0)+'</span><span class="pill">rank q '+sc.q.toFixed(3)+'</span><span class="pill">'+sc.severity+'</span>'+(sc.marginals_exceeded.length?'<span class="pill no">beyond limit: '+sc.marginals_exceeded.join(', ')+'</span>':'')+(sc.hard_rule_failures.length?'<span class="pill no">'+sc.hard_rule_failures.join(', ')+'</span>':'')+'<p style="color:var(--mut);font-size:13px">q is the share of '+E.q.window_d2.length+' historical 10-day windows at least as extreme as the worst scenario day ('+sc.worst_day+'). It is a rank, not a probability.</p></div></div></div>'+
 '<div class="card"><div class="row"><div><b>P&amp;L by position</b>'+bars(r.pnl_by_position)+'</div><div><b>P&amp;L by channel</b>'+bars(r.pnl_by_channel)+'</div></div></div>'+
 '<div class="card"><div class="row">'+lineChart('WEST on-peak price','$/MWh',xs,[{name:'unshocked',y:base.map(x=>x.wh_on),color:'var(--mut)',dash:1},{name:'scenario',y:r.path.map(x=>x.wh_on),color:'var(--acc)'}],{shade:dur,note:'Daily on-peak price of the upstate reference zone. Dashed grey is the same window with no shock; the shaded days carry the shock. The gap between the lines is what gas, load and the price residual add. After the shaded days the line decays back (persistence).'})+
 lineChart('N.Y.C. minus WEST spread','$/MWh',xs,[{name:'unshocked',y:base.map(x=>x.dom_on-x.wh_on),color:'var(--mut)',dash:1},{name:'scenario',y:r.path.map(x=>x.dom_on-x.wh_on),color:'var(--llm)'}],{shade:dur,note:'How much dearer power is in New York City than upstate (congestion). This is the series the retail obligation P5 is exposed to: every extra $/MWh here is paid on about 24 hours of N.Y.C. load.'})+'</div></div>'+
 '<div class="card"><div class="row">'+lineChart('Cumulative book P&L effect of the shock','USD',xs,[{name:'scenario minus unshocked',y:rel,color:'var(--bad)'}],{shade:dur,hline:-E.target_usd,hlabel:'-$5M target',note:'Running total of the money the shock costs the whole book, day by day. Where the red line crosses the dashed target line the loss reaches $5M. It flattens once the shock and its tail are over.'})+
 lineChart('Plausibility D&sup2; per day','5-factor Mahalanobis',xs,[{name:'scenario',y:sc.d2_daily,color:'var(--acc)'}],{shade:dur,hline:line5,hlabel:'q = 5% line',note:'How strange each day is compared with history. Above the dashed line a day is stranger than 95% of past 10-day windows (q below 5%): rare enough to count. Far above the historical range makes the world implausible.'})+'</div><p style="color:var(--mut);font-size:13px">Shaded days carry the shock; later days show the persistence tail. Computed in your browser by a port of the Python engine, checked against it on 18 reference cases.</p>'+GUIDE+'</div>'}

const EXAMPLES=['A week-long polar vortex in January: Henry Hub gas spikes, New York City is cut off from upstate power and retail load runs far above normal.','Heat wave in July with a transmission outage into the city: real-time prices blow out relative to day-ahead for five days.','A mild April week with cheap gas and weak demand.'];
const CONV_FACTS='Reference points (verified in this project): Winter Storm Elliott, 23-24 Dec 2022: real-time N.Y.C. minus WEST on-peak spread about 340 $/MWh, real-time about 3x day-ahead for N.Y.C., load near 22 GW; Jan 2025 cold: WEST day-ahead 190-230 $/MWh, spread 300+; Jun 2025 heat: WEST real-time 270-420 $/MWh on-peak, N.Y.C. real-time 625, load 31.9 GW; Henry Hub is normally 2-5 $/MMBtu; the largest historical spread is about 400 $/MWh.';
function convPrompt(text){const keys=SL.map(([k,l,lo,hi,st])=>'- '+k+' ('+l+'): number in ['+lo+', '+hi+'], step '+st+(k=='duration_days'?', number of shocked days; the engine horizon is 30 days':'')).join('\n');
 return 'You convert a risk manager\'s plain-language stress scenario into numbers for a NYISO power-book scenario engine. You do NOT forecast prices: you only translate the described world into the typed shock vector below. Neutral values are 0 for every key except load_peak_ratio (1) and duration_days (0).\n\nKeys and allowed ranges:\n'+keys+'\n\nSeasons: winter, summer, shoulder (the base window the shock is applied to). Meaning: gas_hh_pct is a percent change of Henry Hub; ny_gas_basis_usd is extra New York gas cost added to the heat-rate call; load_peak_ratio multiplies peak load; wh_onpeak_pct is an extra percent move of the WEST (upstate reference zone) on-peak price beyond what gas and load imply; dom_minus_wh_usd is the extra N.Y.C. minus WEST spread in $/MWh; dart_pct is real-time versus day-ahead in percent.\n\n'+CONV_FACTS+'\n\nChoose values a coherent version of the described world would plausibly have; stay inside the ranges and do not exaggerate. Use 0 or the neutral value for anything the description does not imply.\n\nScenario description:\n<<<'+text+'>>>\n\nReply with only one JSON object: {"season": "winter|summer|shoulder", "shock": {every key above: number}, "why": {key: "one short sentence tying the number to the words of the description"}, "assumptions": ["short strings"]}'}
function clampKey(k,v){const d=SL.find(x=>x[0]==k);if(!d||typeof v!=='number'||!isFinite(v))return null;const[,,lo,hi,st]=d;let c=Math.min(hi,Math.max(lo,v));c=Math.round(c/st)*st;c=+c.toFixed(4);return{val:c,clamped:Math.abs(c-v)>st/2}}
let convCtl=null,LAST=null,exCtl=null;
function explainPrompt(L){const f=v=>(v/1e6).toFixed(2)+'M';const keys=SL.map(([k,l])=>'- '+l+' ['+k+'] = '+L.shock[k]).join('\n');
 return 'You are explaining the result of a stress test on a New York power-trading book to a reader who may not know power markets. Use ONLY the numbers given below and do not invent others. This is an engine output for an assumed world, not a forecast.\n\nBook (loss target $5M, 25% of $20M): P1 long WEST on-peak swap (system price); P2 long N.Y.C. minus WEST spread (congestion); P3 short day-ahead minus real-time spread (real-time risk); P4 heat-rate call (gas); P5 N.Y.C. retail load obligation, short N.Y.C. at a fixed price with a WEST hedge, volume scales with load (zone price and volume); P6 short tail call (spikes). WEST is the upstate reference zone; N.Y.C. is the import-constrained city zone.\n\nParameter meanings:\n'+SL.map(([k,l])=>'- '+l+': '+HELP[k]).join('\n')+'\n\nScenario (season of the base window: '+L.season+'; shocked days: '+L.days+' of a 30-day window):\n'+keys+'\n\nEngine result: loss '+f(L.loss)+'; valid breach: '+(L.breach?'yes':'no')+'. P&L by position (negative is a loss): '+Object.entries(L.pos).map(([k,v])=>k+' '+f(v)).join(', ')+'. Peak WEST on-peak price '+L.peakWest.toFixed(0)+' $/MWh versus '+L.baseWest.toFixed(0)+' unshocked; peak N.Y.C.-WEST spread '+L.peakSpread.toFixed(0)+' versus '+L.baseSpread.toFixed(0)+' unshocked. Plausibility: D2 '+L.d2.toFixed(0)+' at the worst day ('+L.worst+'), the q = 5% line is D2 '+L.d2line.toFixed(0)+', rank q '+L.q.toFixed(3)+' (share of 255 historical 10-day windows at least as extreme; a rank, not a probability), class '+L.sev+(L.mex.length?', beyond historical limits for: '+L.mex.join(', '):'')+(L.fail.length?', rules failed: '+L.fail.join(', '):'')+'. Classes: q below 1% severe, 1-5% adverse, above 5% ordinary; implausible if a factor exceeds 1.25 times its historical range or a hard rule fails.\n\nThe five risk factors on the worst day, against a typical day of that season (definitions: g = log Henry Hub gas; l = log peak load versus its seasonal normal; s = residual of the log WEST on-peak price after gas, load and season; c = N.Y.C. minus WEST on-peak spread in $/MWh; d = log of real-time over day-ahead price at WEST):\n'+L.fac.map(x=>'- '+x.k+' = '+x.v.toFixed(3)+' (typical '+x.mu.toFixed(3)+', historical limits '+x.lo.toFixed(2)+' to '+x.hi.toFixed(2)+')').join('\n')+'\n\nCharts shown on the page: (1) WEST on-peak price, scenario versus unshocked; (2) N.Y.C. minus WEST spread, scenario versus unshocked; (3) cumulative book P&L effect of the shock against the -$5M target line; (4) daily D2 against the q = 5% line.\n\nWrite a COMPLETE explanation that covers every item, using these numbered headings, each on its own line as "N. Title":\n1. The scenario in words.\n2. Every parameter: one line for each of the 8 parameters with its value, its plain meaning and its effect on prices or on the book. If a parameter is at its neutral value, say it plays no role.\n3. The headline result: the loss against the $5M target, and whether it is a valid breach and why.\n4. Every position P1 to P6: one line each with its P&L and the mechanism behind it.\n5. The six risk channels (system, congestion, DA-RT, gas, zone and volume, tail) in two or three sentences.\n6. The four charts: what each one shows for this scenario, with the numbers above.\n7. The plausibility features: D2, rank q, the class, each of the five factors g, l, s, c, d (what it is and how the worst-day value compares with typical and with the limits), the marginal limits and the hard rules.\n8. What a risk manager could do: two or three ideas (a hedge or a limit), clearly labelled as judgement and not as engine output.\nExplain every piece of jargon in a few words. Plain text only: no markdown symbols and no tables. About 600 to 800 words.'}
function renderExpl(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').split('\n').map(l=>/^\s*\d+\.\s+\S/.test(l)&&l.length<100?'<b>'+l+'</b>':l).join('\n')}
async function explainRun(){const out=$('#sbexpl'),note=$('#sbexpnote');if(!LAST)return;
 let sample=null;try{sample=window.claude?await window.claude.use('sample'):null}catch(e){}
 if(!sample){note.textContent='The explanation needs the claude.ai viewer (published page).';return}
 exCtl=new AbortController();$('#sbexb').disabled=true;$('#sbexs').hidden=false;note.textContent='Thinking...';out.textContent='';out.dataset.done='';
 try{const r=await sample(explainPrompt(LAST),{signal:exCtl.signal,modelTier:'default',onText:u=>{out.innerHTML=renderExpl(u.text);note.textContent=''}});
  out.dataset.done='1';if(r.truncated)note.textContent='The answer was cut short; shorten the scenario or try again.'
 }catch(e){if(e.text)out.innerHTML=renderExpl(e.text);const m={cancelled:'Stopped.',not_granted:'Claude access was not allowed for this page.',rate_limited:'Too many requests; try again later.'};note.textContent=m[e.code]||'The explanation failed ('+(e.code||'error')+'). Try again.'}
 finally{$('#sbexb').disabled=false;$('#sbexs').hidden=true;exCtl=null}}
async function convRun(){const txt=$('#sbtxt').value.trim();if(!txt)return;const st=$('#sbstat'),mp=$('#sbmap');
 let sample=null;try{sample=window.claude?await window.claude.use('sample'):null}catch(e){}
 if(!sample){st.textContent='The AI converter needs the claude.ai viewer (published page). The sliders below work everywhere.';return}
 convCtl=new AbortController();$('#sbconv').disabled=true;$('#sbstop').hidden=false;st.textContent='Thinking...';mp.innerHTML='';
 try{const r=await sample.json(convPrompt(txt),{signal:convCtl.signal,modelTier:'default'});
  if(!r||typeof r.shock!=='object')throw{code:'invalid_json'};
  const rows=[];const shock=Object.assign({},RevEngine.NEUTRAL,{duration_days:SB.shock.duration_days});
  SL.forEach(([k])=>{const c=clampKey(k,+r.shock[k]);if(c){shock[k]=c.val;rows.push([k,c.val,(r.why&&r.why[k])||'',c.clamped])}});
  if(!rows.length)throw{code:'invalid_json'};
  SB.shock=shock;if(r.season in D.engine.seasons)SB.season=r.season;$('#sbseason').value=SB.season;setCtl();
  mp.innerHTML='<table><tr><th>Key</th><th class=n>Value</th><th>Reading of the description</th></tr>'+rows.map(x=>'<tr><td>'+SL.find(s=>s[0]==x[0])[1]+'</td><td class=n>'+x[1]+(x[3]?' *':'')+'</td><td>'+String(x[2]).replace(/</g,'&lt;')+'</td></tr>').join('')+'</table><p style="color:var(--mut);font-size:13px">Season: '+SB.season+'. '+(rows.some(x=>x[3])?'* clipped to the allowed range. ':'')+((r.assumptions||[]).length?'Assumptions: '+r.assumptions.map(a=>String(a).replace(/</g,'&lt;')).join('; ')+'. ':'')+'Claude only translates the words; the loss and plausibility below come from the engine.</p>';
  st.textContent='Converted. The scenario is loaded below.';sbOut()
 }catch(e){const m={cancelled:'Stopped.',not_granted:'Claude access was not allowed for this page.',rate_limited:'Too many requests; try again later.',invalid_json:'Claude did not return usable numbers. Rephrase the description and try again.'};st.textContent=m[e.code]||'The conversion failed ('+(e.code||'error')+'). Try again.'}
 finally{$('#sbconv').disabled=false;$('#sbstop').hidden=true;convCtl=null}}
function setCtl(){SL.forEach(([k])=>{$('#sl_'+k).value=SB.shock[k];$('#o_'+k).textContent=SB.shock[k]})}
function sbBind(){const E=D.engine;$('#sbconv').onclick=convRun;$('#sbexb').onclick=explainRun;$('#sbexs').onclick=()=>exCtl&&exCtl.abort();$('#sbstop').onclick=()=>convCtl&&convCtl.abort();document.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{$('#sbtxt').value=EXAMPLES[+b.dataset.ex]});$('#sbseason').onchange=e=>{SB.season=e.target.value;sbOut()};
 SL.forEach(([k])=>{const el=$('#sl_'+k);el.oninput=()=>{SB.shock[k]=+el.value;$('#o_'+k).textContent=el.value;sbOut()}});
 $('#sbpre').onchange=e=>{const s=D.scenarios.filter(x=>x.run=='live_daily_sonnet')[+e.target.value];if(!s)return;if(s.season in E.seasons)SB.season=s.season;SB.shock=Object.assign({},RevEngine.NEUTRAL,fromAgent(s.shocks));$('#sbseason').value=SB.season;setCtl();$('#sbnote').textContent=(s.shocks.spike_days>0?'Spike days in this scenario are ignored here. ':'')+'Loaded: '+s.narrative.slice(0,170)+'...';sbOut()};
 $('#sbreset').onclick=()=>{SB.shock=Object.assign({},RevEngine.NEUTRAL,{duration_days:7});setCtl();$('#sbpre').value='';$('#sbnote').textContent='';sbOut()};sbOut()}
const V={
Brief(){const r=D.runs['live_daily_sonnet'];const cl=r.arms.find(a=>a.arm=='claude'),op=r.arms.find(a=>a.arm=='optimizer');
 return '<div class="card brief"><h2>The assignment</h2><p style="font-style:italic;color:var(--mut)">Students choose a topic relevant to real-world investment management and vibe-code an end-to-end solution that leverages LLM as needed, scoped so that a working prototype runs on public data.</p></div>'+
 '<div class="card"><h2>Our answer</h2><p><b>Topic.</b> Reverse stress testing for a power trading book (handout example 6, adapted to the NYISO market). A risk manager does not ask "what is my loss if X happens?" but <b>"which plausible worlds lose me at least $5M (25% of capital)?"</b></p>'+
 '<p><b>Where the LLM is used.</b> Claude invents coherent stress scenarios as typed shock vectors. It never forecasts prices: a factor engine computes the P&amp;L, and plausibility is checked against 2019-2025 history.</p>'+
 '<p><b>Public data only.</b> NYISO zonal prices and load, Henry Hub gas, NOAA degree days. Raw files stay local; only aggregates are shown here.</p></div>'+
 '<div class="card"><h2>What it produced</h2><div class="row"><div><b>'+r.n_ranked+'</b> ranked scenarios of '+r.n_scenarios+' proposed<br><span style="color:var(--mut)">each with narrative, shock vector, P&amp;L by position and channel</span></div><div><b>'+f2(cl.breaches_mean)+'</b> breaches per run for Claude vs <b>'+f2(op.breaches_mean)+'</b> for a numerical optimizer<br><span style="color:var(--mut)">see Evaluation for why this is not a simple win</span></div></div></div>'+
 '<div class="card warn"><b>Honest status</b><ul>'+D.meta.caveats.map(c=>'<li>'+c+'</li>').join('')+'</ul></div>'},
Pipeline(){return '<div class="card"><h2>End to end</h2><div class="flow">'+node('Public data')+ar+node('Daily factors &amp; risk model')+ar+node('Claude proposes scenarios',1)+ar+node('Schema &amp; hard rules')+ar+node('Engine: P&amp;L by position/channel')+ar+node('Plausibility D&sup2;, rank q')+ar+node('Feedback to Claude',1)+ar+node('Ranked report + audit log')+'</div>'+
 '<p style="color:var(--mut)">Orange boxes are where the LLM is used. Everything else is deterministic code, so every number can be reproduced.</p></div>'+
 '<div class="card step"><h3>1 Target</h3>Start from the loss, not from an event: loss &ge; $5M on a $20M book over a 10-day horizon.</div>'+
 '<div class="card step llm"><h3>2 Propose</h3>Claude gets the book, the shock glossary, plausibility ceilings and a table of real analogues (Winter Storm Elliott, polar vortex, 2025 heat). It answers with typed JSON only.</div>'+
 '<div class="card step"><h3>3 Validate</h3>JSON schema, hard rules (price cap, sign consistency, fabricated analogue check). Rejections are logged.</div>'+
 '<div class="card step"><h3>4 Compute</h3>The engine applies the shocks to a historical window, re-prices the six positions, and reports the loss by position and channel.</div>'+
 '<div class="card step"><h3>5 Judge plausibility</h3>Squared Mahalanobis distance on five factors against seasonal history; q is the share of historical 10-day windows that are at least as extreme.</div>'+
 '<div class="card step llm"><h3>6 Iterate and rank</h3>Engine feedback goes back to Claude; the final list is ranked by plausibility among scenarios that reach the target.</div>'},
Data(){return '<div class="card"><h2>Public data</h2><table><tr><th>Source</th><th>Used for</th><th>Period</th></tr>'+
 '<tr><td>NYISO day-ahead and real-time zonal prices (WEST, N.Y.C.)</td><td>price levels, congestion spread, DA-RT gap</td><td>2019-2026, hourly to daily</td></tr>'+
 '<tr><td>NYISO integrated load</td><td>daily peak load</td><td>2019-2026</td></tr>'+
 '<tr><td>Henry Hub (EIA)</td><td>gas factor (New York gas basis is a stated assumption)</td><td>2019-2026</td></tr>'+
 '<tr><td>NOAA daily temperature</td><td>degree days</td><td>2019-2026</td></tr>'+
 '<tr><td>NYISO real-time fuel mix</td><td>tested as factors (wind, nuclear, hydro): little gain</td><td>2019-2025</td></tr></table>'+
 '<p style="color:var(--mut)">Fit window 2019-2025 (2,557 days). Real events (Jan 2014 polar vortex, Elliott 2022, Jan 2025, Jun 2025) are used to validate the engine and as analogues for Claude.</p></div>'},
Engine(){const w=D.factors.walk_forward;const t=[...new Set(w.map(x=>x.target))];
 return '<div class="card"><h2>Factors</h2><table><tr><th>Factor</th><th>Meaning</th></tr><tr><td>g</td><td>log Henry Hub gas</td></tr><tr><td>l</td><td>log peak load vs seasonal normal</td></tr><tr><td>s</td><td>WEST on-peak price residual after gas, load and season</td></tr><tr><td>c</td><td>N.Y.C. &minus; WEST spread (congestion)</td></tr><tr><td>d</td><td>log real-time / day-ahead at WEST</td></tr></table></div>'+
 '<div class="card"><h2>Daily factor model</h2><p>Each target is explained by daily factors and scored walk-forward on years it never saw.</p><table><tr><th>Model</th>'+t.map(x=>'<th class=n>R&sup2; '+x+'</th>').join('')+'</tr>'+
 [...new Set(w.map(x=>x.model))].map(m=>'<tr><td>'+m+'</td>'+t.map(x=>{const r=w.find(y=>y.model==m&&y.target==x);return '<td class=n>'+(r?r.oos_r2:'-')+'</td>'}).join('')+'</tr>').join('')+'</table>'+
 '<p style="color:var(--mut)">lw = log WEST on-peak, c = N.Y.C.-WEST spread, d = log RT/DA. Persistence (yesterday\'s value) is the strongest daily factor; it is built into the engine as a decaying tail after a shock.</p></div>'+
 '<div class="card"><h2>The book</h2><table><tr><th>Position</th><th>Channel</th></tr><tr><td>P1 long WEST on-peak swap</td><td>system price</td></tr><tr><td>P2 long N.Y.C. / short WEST spread</td><td>congestion</td></tr><tr><td>P3 short DA-RT spread</td><td>DA-RT</td></tr><tr><td>P4 heat-rate call</td><td>gas</td></tr><tr><td>P5 N.Y.C. load obligation</td><td>zone basis and volume</td></tr><tr><td>P6 short tail call</td><td>spike tail</td></tr></table></div>'},
'LLM agent'(){const list=D.scenarios.filter(s=>s.run==run);if(sidx>=list.length)sidx=0;const s=list[sidx];if(!s)return '';
 const sh=s.shocks;return '<div class="card"><h2>One scenario through the pipeline</h2>Run '+sel()+' <select id="sc">'+list.slice(0,30).map((x,i)=>'<option value="'+i+'"'+(i==sidx?' selected':'')+'>#'+x.rank+' '+x.id+'</option>').join('')+'</select></div>'+
 '<div class="card step llm"><h3>1 Claude writes the story</h3><p>'+s.narrative+'</p><span class="pill llm">'+s.driver_class+'</span><span class="pill llm">'+s.season+'</span><span class="pill llm">confidence '+s.confidence+'</span></div>'+
 '<div class="card step llm"><h3>2 ...as a typed shock vector (no price forecast)</h3><pre>'+JSON.stringify(sh,null,1)+'</pre></div>'+
 '<div class="card step"><h3>3 Engine computes the P&amp;L</h3><div class="row"><div><b>by position</b>'+bars(s.pnl_by_position)+'</div><div><b>by channel</b>'+bars(s.pnl_by_channel)+'</div></div><p>Total loss <b>'+fmtM(s.loss_usd)+'</b>'+(s.stated_loss_usd?' (Claude estimated '+fmtM(s.stated_loss_usd)+')':'')+'</p></div>'+
 '<div class="card step"><h3>4 Plausibility</h3><span class="pill">D&sup2; '+s.d2.toFixed(0)+'</span><span class="pill">rank q '+s.q.toFixed(3)+'</span><span class="pill">'+s.severity+'</span><span class="pill">nearest past date '+(s.nearest_date||'-')+'</span><div style="margin-top:6px">Analogue cited: '+(s.analogue.event||'none')+' '+(s.analogue.dates||'')+'</div></div>'+
 '<div class="card step llm"><h3>5 Independent coherence grade</h3>'+(s.coherence?'<table><tr>'+Object.entries(s.coherence).map(([k,v])=>'<th>'+k.replace(/_/g,' ')+'</th>').join('')+'</tr><tr>'+Object.values(s.coherence).map(v=>'<td>'+(v==null?'-':v==1?'pass':'fail')+'</td>').join('')+'</tr></table>'+(s.coherence_note?'<div style="color:var(--mut)">Judge: '+s.coherence_note+'</div>':''):'not graded for this run')+'<div style="color:var(--mut)">Graded blind by a different model than the one that wrote it. Human grading is still pending.</div></div>'},
'Try it'(){const list=D.scenarios.filter(s=>s.run=='live_daily_sonnet').slice(0,30);
 return '<div class="card"><h2>Write your own scenario</h2><p>Set a shock vector, the same typed signal Claude produces, and see the book loss, the price paths and how plausible the world is. Nothing is sent anywhere: the engine runs in this page.</p>'+
 '<h3>Describe it in words</h3><textarea id="sbtxt" rows="3" style="width:100%;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)" placeholder="Describe a stress world in plain English"></textarea>'+'<div style="margin:6px 0">'+EXAMPLES.map((x,i)=>'<button class="sm" data-ex="'+i+'" style="margin:0 6px 6px 0">Example '+(i+1)+'</button>').join('')+'<button class="sm" id="sbconv">Convert to numbers with Claude</button> <button class="sm" id="sbstop" hidden>Stop</button> <span id="sbstat" style="color:var(--mut);font-size:13px"></span></div><div id="sbmap"></div><h3>Or set the numbers yourself</h3>'+'<div class="ctl"><label for="sbseason">Season of the base window</label><select id="sbseason">'+['winter','summer','shoulder'].map(s=>'<option value="'+s+'"'+(s==SB.season?' selected':'')+'>'+s+'</option>').join('')+'</select><span></span></div>'+
 '<div class="ctl"><label for="sbpre">Start from a ranked scenario</label><select id="sbpre"><option value="">(custom)</option>'+list.map((s,i)=>'<option value="'+i+'">#'+s.rank+' '+s.id+'</option>').join('')+'</select><button class="sm" id="sbreset">Reset</button></div><div id="sbnote" style="color:var(--mut);font-size:13px"></div>'+
 SL.map(([k,l,lo,hi,st])=>'<div class="ctl"><label for="sl_'+k+'">'+l+'</label><input type="range" id="sl_'+k+'" min="'+lo+'" max="'+hi+'" step="'+st+'" value="'+SB.shock[k]+'"><output id="o_'+k+'">'+SB.shock[k]+'</output></div><div class="hint">'+HELP[k]+'</div>').join('')+'</div><div id="sbout"></div>'+
 '<div class="card"><h3>Interpret this result with Claude</h3><p class="hint">Claude reads the scenario and the numbers above and writes a complete walk-through: every parameter, the headline result, each of the six positions, the six risk channels, the four charts, and every plausibility feature (D&sup2;, rank q, the five factors, limits and rules), then what a risk manager could do. It only uses the numbers on this page.</p><button class="sm" id="sbexb">Explain this result</button> <button class="sm" id="sbexs" hidden>Stop</button> <span id="sbexpnote" style="color:var(--mut);font-size:13px"></span><div id="sbexpl"></div></div>'},

 return '<div class="card"><h2>Ranked scenarios</h2>Run '+sel()+' &middot; most plausible first (lowest D&sup2;) among those that lose at least $5M</div>'+
 '<div class="card"><table><tr><th>#</th><th>Scenario</th><th>Driver</th><th class=n>Loss</th><th class=n>D&sup2;</th><th class=n>q</th><th class=n>Coherence</th></tr>'+
 list.map(s=>'<tr><td>'+s.rank+'</td><td>'+s.id+'</td><td>'+s.driver_class+'</td><td class=n>'+fmtM(s.loss_usd)+'</td><td class=n>'+s.d2.toFixed(0)+'</td><td class=n>'+s.q.toFixed(3)+'</td><td class=n>'+(s.coherence?Object.values(s.coherence).filter(x=>x!=null).reduce((a,b)=>a+b,0)+'/5':'-')+'</td></tr>').join('')+'</table><p style="color:var(--mut)">Open the LLM agent tab to follow any scenario from story to P&amp;L.</p></div>'},

 return '<div class="card"><h2>Does the LLM add anything? Baselines at equal engine budget</h2>Run '+sel()+'<table><tr><th>Arm</th><th class=n>Breaches / run</th><th class=n>Median D&sup2;</th><th class=n>Engine calls</th></tr>'+
 r.arms.map(x=>'<tr><td>'+x.arm+'</td><td class=n>'+f2(x.breaches_mean)+' &plusmn; '+f2(x.breaches_sd)+'</td><td class=n>'+(x.median_d2==null?'-':x.median_d2.toFixed(0))+'</td><td class=n>'+x.engine_calls+'</td></tr>').join('')+'</table>'+
