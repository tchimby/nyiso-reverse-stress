<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NYISO Reverse Stress</title>
<style>
:root{--bg:#f7f7f5;--fg:#1c1c1a;--mut:#6b6b66;--card:#fff;--line:#e2e2dc;--acc:#2f5fd0;--bad:#c0392b;--good:#2e8b57}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--fg:#ececE8;--mut:#9a9a93;--card:#1f1f1d;--line:#34342f;--acc:#7aa2ff;--bad:#ef6b5b;--good:#5fc28b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,Segoe UI,sans-serif}
header{padding:20px 16px 8px;max-width:1100px;margin:auto}h1{margin:0;font-size:22px}p.sub{margin:4px 0 0;color:var(--mut)}
nav{max-width:1100px;margin:8px auto;padding:0 16px;display:flex;gap:6px;flex-wrap:wrap}
nav button{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main{max-width:1100px;margin:auto;padding:8px 16px 48px}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:600}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mut);font-size:12px;margin-right:4px}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1 1 300px}.bar{height:12px;background:var(--acc);border-radius:3px}.neg{background:var(--bad)}.pos{background:var(--good)}
code,pre{font:12.5px/1.45 ui-monospace,Consolas,monospace}pre{background:var(--bg);padding:8px;border-radius:6px;overflow:auto;margin:6px 0}
select{font:inherit;padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.warn{border-left:4px solid var(--bad)}details summary{cursor:pointer;color:var(--acc)}video{width:100%;max-width:820px;border-radius:8px;border:1px solid var(--line)}
</style>
</head>
<body>
<header><h1 id="t">NYISO reverse stress</h1><p class="sub" id="obj"></p></header>
<nav id="nav"></nav>
<main id="main">Loading...</main>
<script>
const $=(s,r=document)=>r.querySelector(s), fmtM=v=>v==null?'-':(v/1e6).toFixed(2)+'M', f2=v=>v==null?'-':(+v).toFixed(2);
const D={};const TABS=['Overview','Scenarios','Arms','Factors','Ablation','Demo'];let tab='Overview',run='live_daily_sonnet';
async function load(){
 for(const n of ['meta','runs','scenarios','factors','ablations']) D[n]=await (await fetch('data/'+n+'.json')).json();
 $('#t').textContent=D.meta.title;$('#obj').textContent=D.meta.objective;
 $('#nav').innerHTML=TABS.map(t=>'<button data-t="'+t+'">'+t+'</button>').join('');
 $('#nav').onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;draw()}};draw()}
function bars(obj,scale){
 const m=scale||Math.max(...Object.values(obj).map(Math.abs),1);
 return Object.entries(obj).map(([k,v])=>'<div style="display:flex;align-items:center;gap:8px;margin:2px 0"><span style="width:96px;color:var(--mut);font-size:12px">'+k+'</span><div style="flex:1"><div class="bar '+(v<0?'neg':'pos')+'" style="width:'+Math.max(2,Math.abs(v)/m*100)+'%"></div></div><span style="width:62px;text-align:right;font-size:12px">'+fmtM(v)+'</span></div>').join('')}
function sel(){return '<select id="run">'+Object.entries(D.runs).map(([k,v])=>'<option value="'+k+'"'+(k==run?' selected':'')+'>'+v.label+'</option>').join('')+'</select>'}
const V={
Overview(){const r=D.runs[run];
 return '<div class="card">Run '+sel()+' <span class="pill">'+r.n_scenarios+' scenarios</span><span class="pill">'+r.n_ranked+' ranked</span></div>'+
 '<div class="card"><b>Breaches per repeat</b> (loss &ge; $5M, rank q &lt; 5%, hard rules passed)<table><tr><th>Arm</th><th class=n>Breaches</th><th class=n>Median D&sup2;</th><th class=n>Engine calls</th></tr>'+
 r.arms.map(a=>'<tr><td>'+a.arm+'</td><td class=n>'+f2(a.breaches_mean)+' &plusmn; '+f2(a.breaches_sd)+'</td><td class=n>'+(a.median_d2==null?'-':a.median_d2.toFixed(0))+'</td><td class=n>'+a.engine_calls+'</td></tr>').join('')+'</table></div>'+
 '<div class="card warn"><b>Read this before quoting numbers</b><ul>'+D.meta.caveats.map(c=>'<li>'+c+'</li>').join('')+'</ul><span style="color:var(--mut)">'+D.meta.data+'</span></div>'},
Scenarios(){const list=D.scenarios.filter(s=>s.run==run).slice(0,40);
 return '<div class="card">Run '+sel()+' &middot; the 40 most plausible (lowest D&sup2;)</div>'+list.map(s=>{
  const coh=s.coherence?'<span class="pill">coherence '+Object.values(s.coherence).filter(x=>x!=null).reduce((a,b)=>a+b,0)+'/5</span>':'';
  return '<div class="card"><div><b>#'+s.rank+' '+s.id+'</b> <span class="pill">'+s.driver_class+'</span><span class="pill">'+s.season+'</span><span class="pill">'+s.severity+'</span><span class="pill">D&sup2; '+s.d2.toFixed(0)+'</span><span class="pill">q '+s.q.toFixed(3)+'</span><span class="pill">loss '+fmtM(s.loss_usd)+'</span>'+coh+'</div>'+
  '<p>'+s.narrative+'</p><div class="row"><div><b>P&amp;L by position</b>'+bars(s.pnl_by_position)+'</div><div><b>P&amp;L by channel</b>'+bars(s.pnl_by_channel)+'</div></div>'+
  '<details><summary>Shock vector, analogue, grade</summary><pre>'+JSON.stringify(s.shocks,null,1)+'</pre><div>Analogue: '+(s.analogue.event||'none')+' '+(s.analogue.dates||'')+' &middot; nearest past date '+(s.nearest_date||'-')+' &middot; confidence '+s.confidence+'</div>'+(s.coherence_note?'<div style="color:var(--mut)">Judge note: '+s.coherence_note+'</div>':'')+'</details></div>'}).join('')},
Arms(){return '<div class="card">Breaches per repeat across runs</div>'+Object.entries(D.runs).map(([k,r])=>'<div class="card"><b>'+r.label+'</b>'+
  Object.entries(Object.fromEntries(r.arms.map(a=>[a.arm,a.breaches_mean||0]))).map(([k2,v])=>'<div style="display:flex;align-items:center;gap:8px;margin:2px 0"><span style="width:110px;color:var(--mut);font-size:12px">'+k2+'</span><div style="flex:1"><div class="bar" style="width:'+Math.max(1,v/20*100)+'%"></div></div><span style="width:40px;text-align:right;font-size:12px">'+v.toFixed(1)+'</span></div>').join('')+'</div>').join('')+
  '<div class="card">The optimizer wins on D&sup2; in every run. Claude\'s lead in the final run is not comparable to earlier runs (book not recalibrated for the daily-model engine).</div>'},
Factors(){const w=D.factors.walk_forward;const t=[...new Set(w.map(x=>x.target))];
 return '<div class="card"><b>Daily factor model: walk-forward out-of-sample R&sup2; (2022-2025)</b><table><tr><th>Model</th>'+t.map(x=>'<th class=n>'+x+'</th>').join('')+'</tr>'+
 [...new Set(w.map(x=>x.model))].map(m=>'<tr><td>'+m+'</td>'+t.map(x=>{const r=w.find(y=>y.model==m&&y.target==x);return '<td class=n>'+(r?r.oos_r2:'-')+'</td>'}).join('')+'</tr>').join('')+'</table>'+
 '<p style="color:var(--mut)">lw = log WEST on-peak, c = N.Y.C.-WEST spread, d = log RT/DA. Persistence is the strongest daily factor; wind, nuclear and hydro add little.</p></div>'},
Ablation(){const a=D.ablations.anchoring;
 return Object.entries(a).map(([k,rows])=>'<div class="card"><b>Severity anchoring, '+k+'</b> (target shown vs hidden)<table><tr><th>Arm</th><th class=n>Scenarios</th><th class=n>Median loss</th><th class=n>Above target</th><th class=n>Breaches</th></tr>'+
  rows.map(r=>'<tr><td>'+r.arm+'</td><td class=n>'+r.n_scenarios+'</td><td class=n>'+fmtM(+r.loss_median)+'</td><td class=n>'+(100*r.share_above_target).toFixed(0)+'%</td><td class=n>'+r.n_breaches+'</td></tr>').join('')+'</table></div>').join('')},
Demo(){return '<div class="card"><b>Demo</b><p>Tour of the pages (5-frame recording). Put a full recording at <code>ui/media/demo.mp4</code> and it shows below.</p><img src="media/demo_ui_tour.gif" alt="UI tour" style="width:100%;max-width:820px;border-radius:8px;border:1px solid var(--line)"><video controls src="media/demo.mp4" style="margin-top:12px" onerror="this.remove()"></video></div>'}};
function draw(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));$('#main').innerHTML=V[tab]();const s=$('#run');if(s)s.onchange=e=>{run=e.target.value;draw()}}
load().catch(e=>{$('#main').textContent='Could not load data/*.json: '+e+' (serve this folder: python -m http.server)'});
</script>
</body>
</html>
